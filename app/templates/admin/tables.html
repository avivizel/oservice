{% extends "admin/base.html" %}
{% block title %}מסד נתונים{% endblock %}
{% block body %}
<h1>טבלאות נוספות</h1>
<p class="lede">טבלאות טכניות. את המענים עצמם עורכים במסך <a href="/admin/services">מענים</a> — שם כל הפרטים בשורה אחת.</p>
<table class="grid">
  <thead><tr><th>טבלה</th><th>שם</th><th>שורות</th></tr></thead>
  <tbody>
  {% for item in counts %}
    <tr>
      <td class="mono"><a href="/admin/db/{{ item.name }}">{{ item.name }}</a></td>
      <td>{{ item.label }}</td>
      <td>{{ item.count }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
